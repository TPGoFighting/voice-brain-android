name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Platform 35 & Build-Tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Restore Binaries & Permissions
        run: |
          chmod +x ./ci/restore-binaries.sh ./gradlew
          ./ci/restore-binaries.sh

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify APK Output
        run: |
          ls -la app/build/outputs/apk/debug/
          ls -la app/build/outputs/apk/release/
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TPVoiceBrain-v1.0.3-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/TPVoiceBrain-v1.0.3-release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp-voice-brain-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "TP Voice Brain Android Native v1.0.3"
          body: |
            ## TP Voice Brain Android 原生应用 (Jetpack Compose) v1.0.3 更新说明

            - 【ASR 断句判定自定义】工作台控制面板新增“断句停顿判定”选择器（500ms 紧凑 / 800ms 标准 / 1200ms 从容），动态同步服务端百炼 ASR 阈值，彻底解决自然说话与呼吸换气被过敏切句的问题。
            - 【Tier 2 上下文纠错与就地替换】深度适配服务端 Qwen-Flash 上下文快修引擎，自动结合前文语境纠正同音错别字、消除口吃重复，原地异步置换不卡顿。
            - 【悬挂连词连句缓冲】服务端与端侧协同，自动暂存“然后”、“但是”、“而且”等孤立连词并在下一句到达时平滑拼接。
            - 【全链路流式高可用】强化 OkHttp 15s 保活 Ping-Pong 机制与断线自愈 15s 环形音频缓冲重发。
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
