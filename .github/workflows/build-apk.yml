name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Platform 35 & Build-Tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Restore Binaries & Permissions
        run: |
          chmod +x ./ci/restore-binaries.sh ./gradlew
          ./ci/restore-binaries.sh

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify APK Output
        run: |
          ls -la app/build/outputs/apk/debug/
          ls -la app/build/outputs/apk/release/
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TPVoiceBrain-v1.0.2-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/TPVoiceBrain-v1.0.2-release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp-voice-brain-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.2
          name: "TP Voice Brain Android Native v1.0.2"
          body: |
            ## TP Voice Brain Android 原生应用 (Jetpack Compose) v1.0.2 更新说明
            
            - 【手势动态权限请求】录音点击时动态检测 RECORD_AUDIO 运行时麦克风权限，未授权时立即唤起系统授权弹窗，授权后自动无缝开启录音。
            - 【音频硬件兼容性增强】AudioRecord 音频源升级为 DEFAULT -> MIC -> VOICE_RECOGNITION -> VOICE_COMMUNICATION 多级容错链，大幅扩充硬件缓冲区防止缓冲溢出。
            - 【原生异步非阻塞采集】重构端侧音频采集事件循环，音量 RMS 计算与 UI 状态更新异步派发，杜绝 IO 线程阻塞与缓冲丢帧。
            - 【无损音频多格式导出】导出 WAV 自动同步至 Android 系统公用 Downloads 目录（兼容 audio/wav、audio/x-wav、audio/*），并自动调起系统原生分享选择器。
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
