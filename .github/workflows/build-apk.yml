name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Platform 35 & Build-Tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Restore Binaries & Permissions
        run: |
          chmod +x ./ci/restore-binaries.sh ./gradlew
          ./ci/restore-binaries.sh

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify APK Output
        run: |
          ls -la app/build/outputs/apk/debug/
          ls -la app/build/outputs/apk/release/
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TPVoiceBrain-v1.0.1-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/TPVoiceBrain-v1.0.1-release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp-voice-brain-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "TP Voice Brain Android Native v1.0.1"
          body: |
            ## TP Voice Brain Android 原生应用 (Jetpack Compose) v1.0.1 更新说明
            
            - 【ASR 流式识别修复】修复了云端 WebSocket ASR 转发与阿里 Fun-ASR 实时流链路连接异常，实现端侧 16kHz PCM 全双工极速打字与实时句级清洗。
            - 【音频无损导出重构】集成 Android MediaStore 与 FileProvider，导出无损 WAV 文件会自动同步至手机「下载 (Downloads)」目录，并立即唤起原生系统分享面板（支持一键存入文件管理、微信、网盘或邮件）。
            - 【端侧录音源健壮性】强化 AudioRecord 初始化容错策略（优先 MIC 硬件输入并平滑兜底语音识别源），杜绝音频帧内存复写。
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
