name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Platform 35 & Build-Tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Restore Binaries & Permissions
        run: |
          chmod +x ./ci/restore-binaries.sh ./gradlew
          ./ci/restore-binaries.sh

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Resolve Version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Verify APK Output
        run: |
          ls -la app/build/outputs/apk/debug/
          ls -la app/build/outputs/apk/release/
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/TPVoiceBrain-v${APP_VERSION}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/TPVoiceBrain-v${APP_VERSION}-release.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp-voice-brain-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "TP Voice Brain Android Native v${{ env.APP_VERSION }}"
          body: |
            ## TP Voice Brain Android 原生应用 (Jetpack Compose) v${{ env.APP_VERSION }} 更新说明

            详见仓库 README 的版本更新记录。
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
